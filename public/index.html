<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prep2meet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">prep2meet</span>
        <span class="tagline">Pre-call briefing in one pass</span>
      </div>
    </header>

    <main class="shell">
      <section class="panel input-panel">
        <label class="field">
          <span class="label">Company or ticker</span>
          <input
            id="query"
            type="text"
            placeholder="e.g. Snowflake, CRM, or https://example.com"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <details class="settings">
          <summary>API &amp; settings</summary>
          <label class="field">
            <span class="label">API base URL</span>
            <input
              id="apiBase"
              type="url"
              placeholder="https://your-app.vercel.app"
              autocomplete="off"
            />
            <span id="apiHint" class="hint">Leave blank when the UI and API are on the same origin (Vercel). Set this to your Vercel deployment URL when hosting the UI separately (e.g. GitHub Pages).</span>
          </label>
          <label class="field">
            <span class="label">OpenAI API key</span>
            <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" />
            <span class="hint">Optional if OPENAI_API_KEY is set on the server. Otherwise sent to the API for the OpenAI call only — not stored.</span>
          </label>
        </details>

        <button type="button" id="run" class="primary">Generate briefing</button>
        <p id="status" class="status" role="status"></p>
      </section>

      <section id="output" class="panel output hidden" aria-live="polite"></section>
    </main>

    <footer class="foot">
      <p>Curated sources only · SEC + IR portal + Wikipedia + news RSS · Summarized with your key</p>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
